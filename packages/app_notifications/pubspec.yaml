publish_to: none

environment:
  sdk: ">=3.13.1 <4.0.0"
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
